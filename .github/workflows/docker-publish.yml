name: Build and Push Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ghcr.io/alankjohnson/sample-app:latest ./app

      - name: Verify Docker Image
        run: docker images

      - name: Push Docker Image
        run: docker push ghcr.io/alankjohnson/sample-app:latest

      - name: Pull Docker Image
        run: docker pull ghcr.io/alankjohnson/sample-app:latest

      - name: Run Docker Container
        run: |
          docker run -d --name sample-app-test -p 8080:80 ghcr.io/alankjohnson/sample-app:latest
          sleep 5

      - name: Test Application
        run: |
          curl http://localhost:8080

      - name: Stop Docker Container
        if: always()
        run: docker stop sample-app-test